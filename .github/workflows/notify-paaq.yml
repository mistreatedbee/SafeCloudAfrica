name: Notify PAAQ on deploy
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Try a clean, reproducible install first; fall back to a normal install if the lockfile is out of sync
        run: npm ci || npm install

      - name: Build
        id: build
        run: npm run build 2>&1 | tee /tmp/build-log.txt; exit ${PIPESTATUS[0]}

      - name: Notify PAAQ
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          STATUS=$([[ "$BUILD_OUTCOME" == "success" ]] && echo "success" || echo "failed")
          PAYLOAD=$(jq -n \
            --arg v "$COMMIT_SHA" \
            --arg env "production" \
            --arg st "$STATUS" \
            --arg by "$ACTOR" \
            --arg msg "$COMMIT_MESSAGE" \
            '{version:$v,environment:$env,status:$st,deployed_by:$by,message:$msg}')
          curl -s -X POST \
            "https://mookyonwpovxscsbqwwl.supabase.co/functions/v1/deployment-webhook?projectKey=proj_6u2h0ixg" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
